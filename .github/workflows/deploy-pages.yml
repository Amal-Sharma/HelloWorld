name: Deploy Hello World to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      DEPLOY_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test
      - name: Lint source
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and verify the deployed site
        run: npm run test:e2e -- --fully-parallel --shard=${{ matrix.shard }}/8 --grep 'deployment assets|NASA Voyager|new deep-sky visuals|saved and shared viewpoints|science tools show|mission histories and detailed|lunar eclipse and Mercury|cosmic structures|galaxy reference style|named galaxy groups|TON 618 keeps|reference galaxy map preserves inside|void emits|white dwarfs render|spectrum modes|atlas planetary|cosmology diagrams|Mars regions|Tools keeps|unselected Laniakea|Laniakea filaments|radio exposure lifts'
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failures-${{ matrix.shard }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload production output
        if: matrix.shard == 1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy production output
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346